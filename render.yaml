services:
  # 1. PostgreSQL Database Service
  - type: pg
    name: findit-db
    databaseName: findit_db
    user: findit_user
    plan: free

  # 2. Spring Boot Backend Web Service
  - type: web
    name: findit-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DB_URL
        fromDatabase:
          name: findit-db
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@findit.campus.edu
      - key: ADMIN_PASSWORD
        value: Admin@FindIt2026

  # 3. React Frontend Static Site
  - type: web
    name: findit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: findit-backend
          property: host
