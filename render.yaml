databases:
  - name: findit-db
    databaseName: findit_db
    user: findit_user
    plan: free

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: findit-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: findit-db
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@findit.campus.edu
      - key: ADMIN_PASSWORD
        value: Admin@FindIt2026

  # 2. React Frontend Static Site
  - type: web
    name: findit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: redirect
        source: /api/*
        destination: https://findit-backend.onrender.com/api/*
